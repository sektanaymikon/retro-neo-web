<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px Arial}canvas{display:block;width:510px!important;height:288px!important;outline:none;image-rendering:pixelated}#cover{position:absolute;inset:0;background:#08090ef5;display:grid;place-items:center;text-align:center;padding:20px}#cover[hidden]{display:none}h1{font-size:20px;margin:0 0 8px}p{color:#b5b5c3;line-height:1.5}button{font:inherit;background:#ffe06b;color:#151515;border:0;border-radius:6px;padding:11px 32px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#progress{height:3px;background:#292934;border-radius:3px;margin:14px auto;width:240px;overflow:hidden}#bar{height:100%;background:#ffe06b;width:0}</style></head><body><canvas id="canvas" width="510" height="288" tabindex="0" aria-label="Spamton NEO game"></canvas><div id="cover"><div><h1>Spamton NEO Retro Recreation</h1><p>A fangame by Lily Garcia</p><button id="play">Play</button><div id="progress"><div id="bar"></div></div><p id="status">Click Play to load the game and enable sound.</p></div></div><script>
(()=>{'use strict';const base=__ASSET_BASE__,canvas=document.querySelector('canvas'),play=document.getElementById('play'),status=document.getElementById('status'),cover=document.getElementById('cover');let playing=false,muted=false,engine;const records=[];const Native=window.AudioContext||window.webkitAudioContext,originalConnect=AudioNode.prototype.connect;
function send(data){parent.postMessage({retroNeo:true,...data},'*');}
function report(){send({audio:records.map(r=>r.ctx.state).join(', '),playing});}
AudioNode.prototype.connect=function(...args){const record=records.find(r=>args[0]===r.ctx.destination);if(record)args[0]=record.master;return Reflect.apply(originalConnect,this,args);};
if(Native){const Tracked=new Proxy(Native,{construct(Target,args){const ctx=new Target(...args),master=ctx.createGain(),analyser=ctx.createAnalyser();analyser.fftSize=256;Reflect.apply(originalConnect,master,[ctx.destination]);Reflect.apply(originalConnect,master,[analyser]);master.gain.value=muted?0:1;records.push({ctx,master,analyser});ctx.addEventListener('statechange',report);report();return ctx;}});window.AudioContext=Tracked;if(window.webkitAudioContext)window.webkitAudioContext=Tracked;}
function resume(){for(const r of records)if(r.ctx.state==='suspended')r.ctx.resume().catch(()=>{});}
const heldKeys=new Map();
function keyDescription(e){let code=e.code;if(!code){if(/^[a-z]$/i.test(e.key))code='Key'+e.key.toUpperCase();else if(e.key==='Enter')code='Enter';else if(e.key?.startsWith('Arrow')||/^F\d+$/.test(e.key))code=e.key;}return {key:e.key,code,repeat:!!e.repeat,shiftKey:e.shiftKey,ctrlKey:e.ctrlKey,altKey:e.altKey,metaKey:e.metaKey};}
function forwardKey(type,data){if(window.portGodotKey)window.portGodotKey(type==='keydown'?1:0,data);else canvas.dispatchEvent(new KeyboardEvent(type,{...data,bubbles:true,cancelable:true}));}
function releaseKeys(){for(const key of heldKeys.values())forwardKey('keyup',key);heldKeys.clear();}
canvas.addEventListener('pointerdown',()=>{window.focus();canvas.focus();resume();});
window.addEventListener('keydown',e=>{if(!playing)return;if(!e.code&&e.key){e.stopImmediatePropagation();forwardKey('keydown',keyDescription(e));return;}heldKeys.set(e.code,keyDescription(e));resume();},true);
window.addEventListener('keyup',e=>heldKeys.delete(e.code),true);window.addEventListener('blur',releaseKeys);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseKeys();});
window.addEventListener('keydown',e=>{if(e.key==='F4'){e.preventDefault();e.stopImmediatePropagation();send({action:'fullscreen'});}},true);
window.addEventListener('message',e=>{if(e.source!==parent||!e.data?.retroNeo)return;if(e.data.action==='mute'){muted=!muted;for(const r of records)r.master.gain.setValueAtTime(muted?0:1,r.ctx.currentTime);send({muted});}if(e.data.action==='key'&&['keydown','keyup'].includes(e.data.type)&&e.data.key){canvas.focus();const data=e.data.key;if(e.data.type==='keydown')heldKeys.set(data.code,data);else heldKeys.delete(data.code);forwardKey(e.data.type,data);}if(e.data.action==='focus')canvas.focus();resume();});
window.addEventListener('port-input',e=>send({input:e.detail.code,pressed:e.detail.pressed}));
window.addEventListener('error',e=>send({error:e.message}));window.addEventListener('unhandledrejection',e=>send({error:String(e.reason?.message||e.reason)}));
setInterval(()=>{let peak=0;for(const r of records){const samples=new Float32Array(r.analyser.fftSize);r.analyser.getFloatTimeDomainData(samples);for(const value of samples)peak=Math.max(peak,Math.abs(value));}send({audioPeak:peak,muted});},1000);
play.onclick=async()=>{play.disabled=true;status.textContent='Loading game…';try{if(!window.Engine)await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=base+'index.js';script.onload=resolve;script.onerror=()=>reject(Error('Could not download the Godot runner.'));document.head.appendChild(script);});if(!Engine.isWebGLAvailable())throw Error('WebGL is not available in this browser.');engine=new Engine({canvas,executable:'index',canvasResizePolicy:0,focusCanvas:true,experimentalVK:false,gdnativeLibs:[],fileSizes:{[base+'index.wasm']:17472981,[base+'index.pck']:8851232},onProgress:(current,total)=>{const percent=total>0?Math.min(100,Math.round(current/total*100)):0;status.textContent=total>0?'Loading game… '+percent+'%':'Loading game…';document.getElementById('bar').style.width=percent+'%';},onPrint:line=>console.log(line),onPrintError:line=>console.warn(line)});await Promise.all([engine.init(base+'index'),engine.preloadFile(base+'index.pck','game.pck')]);await engine.start({args:['--main-pack','game.pck']});playing=true;cover.hidden=true;resume();canvas.focus();report();}catch(e){status.textContent='Unable to start: '+(e.message||e);play.disabled=false;send({error:status.textContent});}};
})();
</script></body></html>
