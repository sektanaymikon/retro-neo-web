<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spamton NEO Retro Recreation</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#09090c;color:#f5f5f7;font:14px Arial,sans-serif}body{display:flex;flex-direction:column;padding:0 16px}header{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 2px}.brand{display:flex;gap:12px;align-items:center}.mark{font:28px monospace;color:#ffe06b}.brand strong{display:block;font-size:15px;letter-spacing:.2px}.brand small{display:block;color:#97979f;font-size:12px;margin-top:5px}.controls{display:flex;gap:8px;align-items:center}button,a{color:inherit}button{font:inherit;background:#1b1b23;border:1px solid #373742;border-radius:7px;padding:9px 13px;cursor:pointer;transition:background .15s,border-color .15s}button:hover{background:#292933;border-color:#777785}button:focus-visible,a:focus-visible{outline:2px solid #ffe06b;outline-offset:3px}button:disabled{opacity:.4;cursor:default}#fullscreen{border-color:#786739;color:#ffe6a0}a{text-decoration:none;color:#b9b9c1}a:hover{text-decoration:underline;color:#fff}#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:black;border:1px solid #292932;border-radius:10px;box-shadow:0 12px 40px #0005}iframe{border:0;display:block;width:510px;height:288px;position:absolute;left:50%;top:50%;transform-origin:center;transform:translate(-50%,-50%) scale(var(--scale,1))}footer{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;font-size:11px;color:#92929d;padding:13px 2px}kbd{font:inherit;color:#d8d8e0;background:#1b1b23;border:1px solid #34343f;border-bottom-width:2px;border-radius:4px;padding:2px 5px}.keys{display:flex;gap:14px;flex-wrap:wrap}.keys span{white-space:nowrap}#stage:fullscreen{width:100vw;height:100vh;border:0;border-radius:0}#status{font-size:11px;color:#a5bca5;min-width:62px}.port-credit{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:2147483647;opacity:.5;color:#fff;font-family:PortPixel,monospace;font-size:9px;font-weight:400;line-height:1.6;white-space:nowrap;pointer-events:none;user-select:none;text-shadow:1px 1px #000,-1px -1px #000}@media(max-width:600px){body{padding:0 8px}header{gap:12px;padding:12px 2px}.brand strong{font-size:13px}.brand small{font-size:11px}.controls{width:100%;justify-content:flex-end}#status{margin-right:auto;order:-1}footer{font-size:10px;gap:10px}.keys{gap:10px}.port-credit{font-size:8px;right:9px;bottom:9px}}
</style></head><body><header><div class="brand"><span class="mark" aria-hidden="true">*</span><div><strong>Spamton NEO Retro Recreation</strong><small>A fangame by Lily Garcia</small></div></div><div class="controls"><span id="status" role="status">Loading player…</span><button id="mute" disabled>Mute</button><button id="fullscreen">Fullscreen</button></div></header><main id="stage"><iframe id="player" title="Spamton NEO game" allow="autoplay; fullscreen; gamepad"></iframe><div class="port-credit">* Port by MIMIC765/Sekta</div></main><footer><div class="keys"><span><kbd>Z / Enter</kbd> Shoot / Confirm</span><span><kbd>WASD / Arrows</kbd> Move</span><span><kbd>F1</kbd> Help</span><span><kbd>Esc</kbd> Exit fullscreen</span></div><a href="https://cherrysodapop.itch.io/spamton-neo-retro-recreation" target="_blank" rel="noopener">Original game ↗</a></footer><script>
(()=>{'use strict';const base=window.RETRO_NEO_BASE_URL||new URL('.',location.href).href;const player=document.getElementById('player'),stage=document.getElementById('stage'),status=document.getElementById('status'),mute=document.getElementById('mute');
const pixelFont=new FontFace('PortPixel','url('+JSON.stringify(base+'port-pixel.ttf')+')');pixelFont.load().then(font=>document.fonts.add(font)).catch(()=>{});
function fit(){player.style.setProperty('--scale',Math.min(stage.clientWidth/510,stage.clientHeight/288));}new ResizeObserver(fit).observe(stage);document.addEventListener('fullscreenchange',fit);fit();
const toggleFullscreen=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen();player.focus();}catch(e){status.textContent=e.message;}};
document.getElementById('fullscreen').onclick=toggleFullscreen;
mute.onclick=()=>{player.contentWindow.postMessage({retroNeo:true,action:'mute'},'*');player.focus();};
window.addEventListener('message',e=>{if(e.source!==player.contentWindow||!e.data?.retroNeo)return;const d=e.data;if(d.action==='fullscreen')toggleFullscreen();if('audioPeak'in d){status.dataset.audioPeak=d.audioPeak;status.dataset.muted=d.muted;}if('audio'in d)status.textContent=d.audio.includes('running')?'Sound ready':d.audio.includes('suspended')?'Sound muted':'';if(d.playing)mute.disabled=false;if('muted'in d){mute.textContent=d.muted?'Unmute':'Mute';if(!mute.disabled)status.textContent=d.muted?'Sound muted':'Sound ready';}if(d.error)status.textContent=d.error;});
fetch(base+'runner.html').then(r=>{if(!r.ok)throw Error('Player download failed ('+r.status+')');return r.text()}).then(html=>{player.srcdoc=html.replace('__ASSET_BASE__',JSON.stringify(base));status.textContent='';}).catch(e=>status.textContent=e.message);
})();
</script></body></html>
